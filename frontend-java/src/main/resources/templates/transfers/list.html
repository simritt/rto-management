<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Ownership Transfers - RTO Management</title>
</head>
<body>
<div th:fragment="content">

    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Vehicle Ownership Transfers</h1>
            <p class="text-sm text-slate-500">Track and approve vehicle transfer requests between citizens</p>
        </div>
        <div>
            <a th:href="@{/transfers/new}"
               class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-blue-700">
                + Initiate Transfer
            </a>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="mb-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <form method="get" th:action="@{/transfers}" class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Status</label>
                <select name="status" class="w-44 rounded border border-slate-300 bg-white px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none">
                    <option value="">All Statuses</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">PENDING</option>
                    <option value="APPROVED" th:selected="${status == 'APPROVED'}">APPROVED</option>
                    <option value="REJECTED" th:selected="${status == 'REJECTED'}">REJECTED</option>
                </select>
            </div>

            <div class="flex gap-2">
                <button type="submit" class="rounded bg-slate-800 px-4 py-1.5 text-sm font-medium text-white hover:bg-slate-700">Filter</button>
                <a th:href="@{/transfers}" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-50">Reset</a>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-xs uppercase font-medium text-slate-500">
            <tr>
                <th class="px-6 py-3">Transfer ID</th>
                <th class="px-6 py-3">Vehicle ID</th>
                <th class="px-6 py-3">From Citizen</th>
                <th class="px-6 py-3">To Citizen</th>
                <th class="px-6 py-3">Application ID</th>
                <th class="px-6 py-3">Status</th>
                <th class="px-6 py-3 text-right">Action</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
            <tr th:if="${data.path('items').isEmpty()}">
                <td colspan="7" class="px-6 py-8 text-center text-slate-400">No ownership transfers found.</td>
            </tr>
            <tr th:each="t : ${data.path('items')}" class="hover:bg-slate-50">
                <td class="px-6 py-4 font-mono font-semibold text-slate-900">
                    <a th:href="@{/transfers/{id}(id=${t.path('transfer_id').asLong()})}"
                       class="text-blue-600 hover:underline" th:text="|#${t.path('transfer_id').asLong()}|">#1</a>
                </td>
                <td class="px-6 py-4 font-mono text-xs">
                    <a th:href="@{/vehicles/{id}(id=${t.path('vehicle_id').asLong()})}"
                       class="text-blue-600 hover:underline" th:text="|Vehicle #${t.path('vehicle_id').asLong()}|">Vehicle #1</a>
                </td>
                <td class="px-6 py-4 text-xs font-mono text-slate-600"
                    th:text="${t.path('from_citizen_id').isNull() ? '-' : 'Citizen #' + t.path('from_citizen_id').asText()}">-</td>
                <td class="px-6 py-4 text-xs font-mono text-slate-900"
                    th:text="|Citizen #${t.path('to_citizen_id').asText()}|">Citizen #2</td>
                <td class="px-6 py-4 text-xs font-mono text-slate-600">
                    <a th:href="@{/applications/{id}(id=${t.path('application_id').asLong()})}"
                       class="text-blue-600 hover:underline" th:text="|App #${t.path('application_id').asLong()}|">App #1</a>
                </td>
                <td class="px-6 py-4">
                    <span th:if="${t.path('status').asText() == 'PENDING'}"
                          class="rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-800">PENDING</span>
                    <span th:if="${t.path('status').asText() == 'APPROVED'}"
                          class="rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-semibold text-emerald-800">APPROVED</span>
                    <span th:if="${t.path('status').asText() == 'REJECTED'}"
                          class="rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-semibold text-red-800">REJECTED</span>
                </td>
                <td class="px-6 py-4 text-right">
                    <a th:href="@{/transfers/{id}(id=${t.path('transfer_id').asLong()})}"
                       class="rounded border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-50">View & Decision</a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div th:replace="~{fragments/ui :: pager(${data}, '?')}"></div>
    </div>

</div>
</body>
</html>
