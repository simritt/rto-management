<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Error - RTO Management</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="max-w-xl rounded-lg bg-white p-6 shadow-sm">
        <h1 class="text-xl font-semibold text-red-700">Error <span th:text="${status}">500</span></h1>
        <p class="mt-2 text-slate-700" th:text="${detail}">Something went wrong.</p>
        <ul th:if="${errors != null}" class="mt-3 list-disc pl-5 text-sm text-slate-600">
            <li th:each="e : ${errors}" th:text="|${e.path('field').asText()}: ${e.path('message').asText()}|"></li>
        </ul>
        <a th:href="@{/}" class="mt-4 inline-block text-blue-600 hover:underline">Back to dashboard</a>
    </div>
</th:block>
</body>
</html>
