<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Citizens - RTO Management</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold">Citizens</h1>
        <a th:if="${user.can('citizen.create')}" th:href="@{/citizens/new}"
           class="rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">+ Register citizen</a>
    </div>

    <form method="get" th:action="@{/citizens}" class="mb-4 flex flex-wrap gap-2">
        <input type="text" name="search" th:value="${search}" placeholder="Search by code, name or phone"
               class="w-72 rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
        <select name="blacklisted" class="rounded border border-slate-300 bg-white px-3 py-2 text-sm">
            <option value="">All citizens</option>
            <option value="true" th:selected="${blacklisted == 'true'}">Blacklisted only</option>
            <option value="false" th:selected="${blacklisted == 'false'}">Not blacklisted</option>
        </select>
        <button type="submit" class="rounded bg-slate-800 px-4 py-2 text-sm text-white hover:bg-slate-700">Search</button>
        <a th:href="@{/citizens}" class="px-2 py-2 text-sm text-slate-500 hover:underline">Reset</a>
    </form>

    <div class="overflow-hidden rounded-lg bg-white shadow-sm">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Code</th>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Phone</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3">Registered</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${result.path('items')}" class="border-t border-slate-100 hover:bg-slate-50">
                <td class="px-4 py-3 font-medium">
                    <a th:href="@{/citizens/{id}(id=${c.path('citizen_id').asLong()})}" class="text-blue-600 hover:underline"
                       th:text="${c.path('citizen_code').asText()}"></a>
                </td>
                <td class="px-4 py-3" th:text="|${c.path('first_name').asText()} ${c.path('last_name').asText()}|"></td>
                <td class="px-4 py-3" th:text="${c.path('phone_primary').asText()}"></td>
                <td class="px-4 py-3">
                    <span th:if="${c.path('blacklisted').asBoolean()}" th:replace="~{fragments/ui :: badge('Blacklisted', 'red')}"></span>
                    <span th:unless="${c.path('blacklisted').asBoolean()}" th:replace="~{fragments/ui :: badge('Active', 'green')}"></span>
                </td>
                <td class="px-4 py-3 text-slate-500" th:text="${#strings.substringBefore(c.path('registered_at').asText(), 'T')}"></td>
            </tr>
            <tr th:if="${result.path('items').size() == 0}">
                <td colspan="5" class="px-4 py-8 text-center text-slate-500">No citizens found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/ui :: pager(${result}, ${pagerBase})}"></div>
</th:block>
</body>
</html>
