<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Record Payment - RTO Management</title>
</head>
<body>
<div th:fragment="content" class="max-w-3xl mx-auto">

    <!-- Top Breadcrumb -->
    <div class="mb-6">
        <a th:href="@{/payments}" class="text-sm font-medium text-blue-600 hover:underline">&larr; Back to Payments</a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Record Payment</h1>
        <p class="mt-1 text-sm text-slate-500">Initiate or log an online/counter revenue collection transaction.</p>
    </div>

    <!-- Main Card -->
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form th:action="@{/payments}" method="post" class="space-y-6">

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Payable Type <span class="text-red-500">*</span></label>
                    <select name="payable_type" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                        <option value="APPLICATION" th:selected="${prePayableType == 'APPLICATION'}">APPLICATION (Application Processing Fee)</option>
                        <option value="CHALLAN" th:selected="${prePayableType == 'CHALLAN'}">CHALLAN (Traffic Fine Compound)</option>
                        <option value="PERMIT" th:selected="${prePayableType == 'PERMIT'}">PERMIT (Commercial Permit Fee)</option>
                        <option value="ROAD_TAX" th:selected="${prePayableType == 'ROAD_TAX'}">ROAD_TAX (Annual Motor Road Tax)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Payable ID <span class="text-red-500">*</span></label>
                    <input type="number" name="payable_id" required th:value="${prePayableId}" placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">ID of the application, challan, permit, or road tax record.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Amount (₹) <span class="text-red-500">*</span></label>
                    <input type="number" step="0.01" min="0.01" name="amount" required th:value="${preAmount}" placeholder="500.00"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono font-bold focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Gateway Outcome <span class="text-red-500">*</span></label>
                    <select name="outcome" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                        <option value="SUCCESS">SUCCESS - Immediate Settlement</option>
                        <option value="FAILED">FAILED - Gateway Error</option>
                        <option value="TIMEOUT">TIMEOUT - Awaiting Webhook</option>
                    </select>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Gateway Reference / Order ID (Optional)</label>
                    <input type="text" name="gateway_reference" placeholder="e.g. PAY-GATEWAY-12345"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Unique external gateway reference. Auto-generated if left blank.</p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <a th:href="@{/payments}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">
                    Process Payment &rarr;
                </button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
