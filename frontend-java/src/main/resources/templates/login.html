<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - RTO Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
<form th:action="@{/login}" method="post" class="w-full max-w-sm rounded-xl bg-white p-8 shadow">
    <h1 class="text-2xl font-semibold text-slate-800">RTO Management</h1>
    <p class="text-sm text-slate-500 mb-6">Sign in to continue</p>

    <div th:if="${error}" class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-700" th:text="${error}"></div>

    <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus th:value="${username}"
           class="mb-4 w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none">

    <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
    <input id="password" name="password" type="password" required
           class="mb-6 w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none">

    <button type="submit" class="w-full rounded bg-blue-600 py-2 font-medium text-white hover:bg-blue-700">Sign in</button>
</form>
</body>
</html>
