<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Issue Learner Licence - RTO Management</title>
</head>
<body>
<div th:fragment="content" class="max-w-3xl mx-auto">

    <!-- Top Breadcrumb -->
    <div class="mb-6">
        <a th:href="@{/learner-licences}" class="text-sm font-medium text-blue-600 hover:underline">&larr; Back to Learner Licences</a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Issue Learner Licence</h1>
        <p class="mt-1 text-sm text-slate-500">Grant provisional driving authorization valid for learning on public roads.</p>
    </div>

    <!-- Main Card -->
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form th:action="@{/learner-licences}" method="post" class="space-y-6">

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Citizen ID <span class="text-red-500">*</span></label>
                    <input type="number" name="citizen_id" required th:value="${preCitizenId}" placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Applicant cannot have another ACTIVE learner licence.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Application ID <span class="text-red-500">*</span></label>
                    <input type="number" name="application_id" required th:value="${preApplicationId}" placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Application status must be APPROVED.</p>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Registering RTO Office <span class="text-red-500">*</span></label>
                    <select name="office_id" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                        <option value="">-- Select Office --</option>
                        <option th:each="off : ${offices}" th:value="${off.path('office_id').asLong()}"
                                th:text="|${off.path('office_name').asText()} (${off.path('office_code').asText()})|"></option>
                    </select>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Learner Licence Number (Optional)</label>
                    <input type="text" name="licence_number" placeholder="Leave blank to auto-generate (LL-...)"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Issue Date</label>
                    <input type="date" name="issue_date"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Defaults to today if blank.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Expiry Date</label>
                    <input type="date" name="expiry_date"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Defaults to +6 months if blank.</p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <a th:href="@{/learner-licences}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">
                    Issue Learner Licence &rarr;
                </button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
