<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Schedule Driving Test - RTO Management</title>
</head>
<body>
<div th:fragment="content" class="max-w-3xl mx-auto">

    <!-- Top Breadcrumb -->
    <div class="mb-6">
        <a th:href="@{/driving-tests}" class="text-sm font-medium text-blue-600 hover:underline">&larr; Back to Driving Tests</a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Schedule Driving Test</h1>
        <p class="mt-1 text-sm text-slate-500">Book an on-track competency examination slot for an applicant.</p>
    </div>

    <!-- Main Card -->
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form th:action="@{/driving-tests}" method="post" class="space-y-6">

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Application ID <span class="text-red-500">*</span></label>
                    <input type="number" name="application_id" required th:value="${preApplicationId}" placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Application must be open (non-terminal).</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Citizen ID <span class="text-red-500">*</span></label>
                    <input type="number" name="citizen_id" required th:value="${preCitizenId}" placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Must match the citizen of the application.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Test Centre <span class="text-red-500">*</span></label>
                    <select name="test_centre_id" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                        <option value="">-- Select Test Centre --</option>
                        <option th:each="tc : ${testCentres}" th:value="${tc.path('test_centre_id').asLong()}"
                                th:text="|${tc.path('centre_name').asText()} (Office #${tc.path('office_id').asLong()})|"></option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Examiner Employee ID <span class="text-red-500">*</span></label>
                    <input type="number" name="examiner_employee_id" required placeholder="e.g. 1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Must be an active employee in the system.</p>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Scheduled Date & Time <span class="text-red-500">*</span></label>
                    <input type="datetime-local" name="scheduled_at" required
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <p class="mt-1 text-xs text-slate-400">Must be scheduled in the future.</p>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Remarks (Optional)</label>
                    <input type="text" name="remarks" placeholder="Track slot #, vehicle requirement notes..."
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <a th:href="@{/driving-tests}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">
                    Schedule Test &rarr;
                </button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
