<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Security Roles - RTO Management</title>
</head>
<body>
<div th:fragment="content">

    <!-- Page Header & Action Bar -->
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Security Roles & Permissions</h1>
            <p class="mt-1 text-sm text-slate-500">Configure role-based access control (RBAC) schemas, privilege bundles, and resource authorization policies.</p>
        </div>
        <div>
            <a th:if="${user.can('rbac.manage')}" th:href="@{/admin/roles/new}"
               class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-blue-700">
                + Create New Role
            </a>
        </div>
    </div>

    <!-- Data Table Card -->
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <table class="min-w-full divide-y divide-slate-200 text-xs">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold">
                <tr>
                    <th scope="col" class="px-5 py-3.5 text-left">Role ID</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Role Name</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Granted Permissions</th>
                    <th scope="col" class="px-5 py-3.5 text-right">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 bg-white">
                <tr th:if="${roles == null || #lists.isEmpty(roles)}">
                    <td colspan="4" class="px-5 py-8 text-center text-slate-400">No security roles defined.</td>
                </tr>
                <tr th:each="r : ${roles}" class="hover:bg-slate-50/80 transition-colors">
                    <td class="px-5 py-3.5 font-mono text-slate-600" th:text="|#${r.path('role_id').asLong()}|">#1</td>
                    <td class="px-5 py-3.5 font-bold text-slate-900">
                        <a th:href="@{'/admin/roles/' + ${r.path('role_id').asLong()}}" class="text-blue-600 hover:underline"
                           th:text="${r.path('role_name').asText()}">Admin</a>
                    </td>
                    <td class="px-5 py-3.5 text-slate-600">
                        <div class="flex flex-wrap gap-1 max-w-2xl">
                            <span th:each="p, stat : ${r.path('permissions')}"
                                  th:if="${stat.index < 8}"
                                  class="inline-flex rounded bg-slate-100 px-2 py-0.5 text-[10px] font-mono text-slate-700"
                                  th:text="${p.asText()}">citizen.view</span>
                            <span th:if="${r.path('permissions').size() > 8}"
                                  class="inline-flex rounded bg-slate-200 px-2 py-0.5 text-[10px] font-semibold text-slate-700"
                                  th:text="|...+${r.path('permissions').size() - 8} more|">+10 more</span>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 text-right">
                        <a th:href="@{'/admin/roles/' + ${r.path('role_id').asLong()}}" class="font-medium text-blue-600 hover:text-blue-800">Permissions Matrix &rarr;</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
