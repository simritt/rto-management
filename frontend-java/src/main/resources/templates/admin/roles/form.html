<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Create Security Role - RTO Management</title>
</head>
<body>
<div th:fragment="content">

    <div class="mb-6">
        <a th:href="@{/admin/roles}" class="text-xs font-medium text-slate-500 hover:text-slate-800">&larr; Back to Roles</a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Create Security Role</h1>
        <p class="mt-1 text-sm text-slate-500">Define a new authorization role and configure its initial permission bundle.</p>
    </div>

    <div class="max-w-3xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form method="post" th:action="@{/admin/roles}" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Role Name *</label>
                <input type="text" name="role_name" required minlength="2" maxlength="50" placeholder="e.g. Traffic_Superintendent"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
                <p class="mt-1 text-[11px] text-slate-500">Unique role identifier.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Granted Permissions</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 rounded-lg border border-slate-200 bg-slate-50 p-4 max-h-80 overflow-y-auto">
                    <div th:each="p : ${permissions}" class="flex items-center gap-2">
                        <input type="checkbox" name="permission_keys" th:id="|perm_${p.path('permission_id').asLong()}|"
                               th:value="${p.path('permission_key').asText()}"
                               class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <label th:for="|perm_${p.path('permission_id').asLong()}|" class="text-xs font-mono text-slate-800"
                               th:text="${p.path('permission_key').asText()}">citizen.view</label>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/admin/roles}" class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-xs font-semibold text-white shadow-sm hover:bg-blue-700">Create Role</button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
