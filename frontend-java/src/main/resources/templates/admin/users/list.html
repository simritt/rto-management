<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>User Accounts - RTO Management</title>
</head>
<body>
<div th:fragment="content">

    <!-- Page Header & Action Bar -->
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">User Accounts</h1>
            <p class="mt-1 text-sm text-slate-500">Manage portal user authentication credentials, account lockouts, and assigned security roles.</p>
        </div>
        <div>
            <a th:if="${user.can('user.manage')}" th:href="@{/admin/users/new}"
               class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-blue-700">
                + New User Account
            </a>
        </div>
    </div>

    <!-- Filter Bar Card -->
    <div class="mb-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <form method="get" th:action="@{/admin/users}" class="grid gap-4 sm:grid-cols-2 md:grid-cols-4 items-end">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Status</label>
                <select name="is_active" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
                    <option value="">All Accounts</option>
                    <option value="true" th:selected="${isActive != null && isActive == true}">Active Only</option>
                    <option value="false" th:selected="${isActive != null && isActive == false}">Inactive Only</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Search Username</label>
                <input type="text" name="search" th:value="${search}" placeholder="Username query"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
            </div>
            <div></div>
            <div class="flex gap-2">
                <button type="submit" class="w-full rounded-lg bg-slate-800 px-4 py-2 text-xs font-semibold text-white hover:bg-slate-700">Filter</button>
                <a th:href="@{/admin/users}" class="rounded-lg border border-slate-300 px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100">Reset</a>
            </div>
        </form>
    </div>

    <!-- Data Table Card -->
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <table class="min-w-full divide-y divide-slate-200 text-xs">
            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold">
                <tr>
                    <th scope="col" class="px-5 py-3.5 text-left">User ID</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Username</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Person ID</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Roles</th>
                    <th scope="col" class="px-5 py-3.5 text-left">Last Login</th>
                    <th scope="col" class="px-5 py-3.5 text-center">Status</th>
                    <th scope="col" class="px-5 py-3.5 text-right">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 bg-white">
                <tr th:if="${page == null || page.path('items').isEmpty()}">
                    <td colspan="7" class="px-5 py-8 text-center text-slate-400">No user accounts found.</td>
                </tr>
                <tr th:each="u : ${page.path('items')}" class="hover:bg-slate-50/80 transition-colors">
                    <td class="px-5 py-3.5 font-mono text-slate-600" th:text="|#${u.path('user_id').asLong()}|">#1</td>
                    <td class="px-5 py-3.5 font-semibold text-slate-900">
                        <a th:href="@{'/admin/users/' + ${u.path('user_id').asLong()}}" class="text-blue-600 hover:underline"
                           th:text="${u.path('username').asText()}">admin</a>
                    </td>
                    <td class="px-5 py-3.5 font-mono text-slate-600" th:text="|Person #${u.path('person_id').asLong()}|">1</td>
                    <td class="px-5 py-3.5 text-slate-700">
                        <div class="flex flex-wrap gap-1">
                            <span th:each="r : ${u.path('roles')}"
                                  class="inline-flex rounded bg-slate-100 px-2 py-0.5 text-[10px] font-medium text-slate-800"
                                  th:text="${r.asText()}">Admin</span>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 font-mono text-[11px]"
                        th:text="${u.path('last_login_at').isNull() ? 'Never' : u.path('last_login_at').asText()}">Never</td>
                    <td class="px-5 py-3.5 text-center">
                        <span th:if="${u.path('is_active').asBoolean()}" class="inline-flex rounded-full bg-emerald-50 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-700 border border-emerald-200">ACTIVE</span>
                        <span th:unless="${u.path('is_active').asBoolean()}" class="inline-flex rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-semibold text-slate-700 border border-slate-200">INACTIVE</span>
                    </td>
                    <td class="px-5 py-3.5 text-right">
                        <a th:href="@{'/admin/users/' + ${u.path('user_id').asLong()}}" class="font-medium text-blue-600 hover:text-blue-800">Manage &rarr;</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination Bar -->
        <div th:if="${page != null && page.path('pages').asInt() > 1}" class="flex items-center justify-between border-t border-slate-200 bg-slate-50 px-5 py-3 text-xs">
            <span class="text-slate-600" th:text="|Page ${page.path('page').asInt()} of ${page.path('pages').asInt()} (${page.path('total').asLong()} total accounts)|"></span>
            <div class="flex gap-1">
                <a th:if="${page.path('page').asInt() > 1}"
                   th:href="@{/admin/users(page=${page.path('page').asInt() - 1}, is_active=${isActive}, search=${search})}"
                   class="rounded border border-slate-300 bg-white px-3 py-1 text-slate-700 hover:bg-slate-100">&larr; Previous</a>
                <a th:if="${page.path('page').asInt() < page.path('pages').asInt()}"
                   th:href="@{/admin/users(page=${page.path('page').asInt() + 1}, is_active=${isActive}, search=${search})}"
                   class="rounded border border-slate-300 bg-white px-3 py-1 text-slate-700 hover:bg-slate-100">Next &rarr;</a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
