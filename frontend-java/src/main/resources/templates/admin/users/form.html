<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>New User Account - RTO Management</title>
</head>
<body>
<div th:fragment="content">

    <div class="mb-6">
        <a th:href="@{/admin/users}" class="text-xs font-medium text-slate-500 hover:text-slate-800">&larr; Back to Users</a>
        <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Provision User Account</h1>
        <p class="mt-1 text-sm text-slate-500">Create login credentials for an existing person and grant security roles.</p>
    </div>

    <div class="max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form method="post" th:action="@{/admin/users}" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Person ID *</label>
                <input type="number" name="person_id" th:value="${prePersonId}" required placeholder="Numeric Person ID"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
                <p class="mt-1 text-[11px] text-slate-500">The person identity record who owns this login credential.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Username *</label>
                <input type="text" name="username" required minlength="3" maxlength="50" placeholder="e.g. officer.sharma"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
                <p class="mt-1 text-[11px] text-slate-500">Alphanumeric, dots, underscores, hyphens, and @ permitted.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Initial Password *</label>
                <input type="password" name="password" required minlength="8" maxlength="72" placeholder="Minimum 8 characters"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Assign Initial Roles</label>
                <div class="grid grid-cols-2 gap-2 rounded-lg border border-slate-200 bg-slate-50 p-4 max-h-48 overflow-y-auto">
                    <div th:each="r : ${roles}" class="flex items-center gap-2">
                        <input type="checkbox" name="role_ids" th:id="|role_${r.path('role_id').asLong()}|"
                               th:value="${r.path('role_id').asLong()}"
                               class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <label th:for="|role_${r.path('role_id').asLong()}|" class="text-xs text-slate-700 font-medium"
                               th:text="${r.path('role_name').asText()}">Role Name</label>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/admin/users}" class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-xs font-semibold text-white shadow-sm hover:bg-blue-700">Create Account</button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
