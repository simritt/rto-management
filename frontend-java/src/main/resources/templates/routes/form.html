<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Create Route - RTO Management</title>
</head>
<body>
<div th:fragment="content" class="max-w-xl">

    <div class="mb-6">
        <a th:href="@{/routes}" class="text-sm font-medium text-blue-600 hover:underline">&larr; Back to Routes</a>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">Create Transport Route</h1>
        <p class="text-sm text-slate-500">Define a designated origin-destination corridor for commercial carriage permits.</p>
    </div>

    <div th:if="${formError}" class="mb-4 rounded bg-red-50 border border-red-200 px-4 py-2 text-sm text-red-800" th:text="${formError}"></div>

    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <form th:action="@{/routes}" method="post" class="space-y-4">

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Route Name <span class="text-red-500">*</span></label>
                <input name="route_name" type="text" required placeholder="e.g. Bengaluru - Mysuru Express Corridor"
                       th:value="${form['route_name']}"
                       class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                <div th:if="${fieldErrors != null and fieldErrors.containsKey('route_name')}" class="mt-1 text-xs text-red-600" th:text="${fieldErrors['route_name']}"></div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Origin <span class="text-red-500">*</span></label>
                    <input name="origin" type="text" required placeholder="e.g. Bengaluru"
                           th:value="${form['origin']}"
                           class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('origin')}" class="mt-1 text-xs text-red-600" th:text="${fieldErrors['origin']}"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Destination <span class="text-red-500">*</span></label>
                    <input name="destination" type="text" required placeholder="e.g. Mysuru"
                           th:value="${form['destination']}"
                           class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('destination')}" class="mt-1 text-xs text-red-600" th:text="${fieldErrors['destination']}"></div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-4">
                <a th:href="@{/routes}" class="rounded border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="rounded bg-blue-600 px-6 py-2 text-sm font-medium text-white hover:bg-blue-700 shadow">
                    Create Route
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
